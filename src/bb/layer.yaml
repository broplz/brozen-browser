# BB layer registry (ADR-0002 Решение 2): a conflict in src/bb/** belongs to the epic by directory name, anywhere else by this file; a foreign file without an entry is a registry defect.

# Zen base the layer sits on (read by scripts/bb/rebase.sh).
base:
  zen: 1.23.4b
  firefox: 158.0.1
  commit: 541ee55

# Hook lines in Zen flat files, one entry per line.
# Entry schema:
#   - file: <repo-relative path of the Zen flat file>
#     line: <the exact hook line>
#     epic: <layer | eN-slug, e.g. e3-little-bb>
#     why: <one-line reason>
hooks:
  - file: src/zen/moz.build
    line: 'DIRS += ["../bb"]'
    epic: layer
    why: builds src/bb/ as a Zen subdirectory
  - file: src/browser/base/content/zen-assets.jar.inc.mn
    line: '#include ../../../bb/jar.inc.mn'
    epic: layer
    why: registers BB chrome files in the browser jar
  - file: src/browser/base/content/zen-assets.inc.xhtml
    line: '#include ../../../bb/bb-assets.inc.xhtml'
    epic: layer
    why: includes BB assets into browser.xhtml
  - file: src/zen/common/ZenPreloadedScripts.js
    line: '"chrome://browser/content/bb/BBStartup.mjs", // BB(layer): must stay last'
    epic: layer
    why: loads BBStartup.mjs after all Zen modules
  - file: src/zen/ZenComponents.manifest
    line: '#include ../bb/BBComponents.manifest'
    epic: layer
    why: registers BB components
  - file: configs/common/mozconfig
    line: '. "$topsrcdir/../configs/bb/mozconfig"'
    epic: layer
    why: sources BB build flags after Zen's common flags

# Direct edits (<= ~10 lines, marked BB(eN)) in Zen flat files.
# Entry schema:
#   - file: <repo-relative path>
#     epic: <layer | eN-slug>
#     why: <one-line reason>
edits:
  - file: surfer.json
    epic: e0
    why: adds brand bb (BROzen BROwser, short BB) and sets vendor broplz; ids stay Zen's

# Edits to Zen's own .patch files (only with allow_zen_patch, marker inside the hunk).
# Entry schema:
#   - file: <repo-relative path of the .patch>
#     epic: <layer | eN-slug>
#     why: <one-line reason>
zen_patches: []
