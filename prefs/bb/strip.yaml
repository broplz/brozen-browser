# ADR-0003 2.7: the five BROzen switches (true = stripped).
- name: bb.strip.eme
  value: true

- name: bb.strip.ai
  value: true

- name: bb.strip.sync
  value: true

- name: bb.strip.mods
  value: true

- name: bb.strip.boosts
  value: false

